<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro - SGIE</title>

    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../auth.css">
    <link rel="stylesheet" href="cadastro.css">
</head>


<body class="cadastro-page">

    <nav class="navbar">

        <div class="navbar-container">

            <a
                href="../../index.html"
                class="brand"
            >
                SGIE

                <span class="brand-badge">
                    Eventos
                </span>
            </a>

        </div>

    </nav>


    <main class="auth-page">

        <section class="auth-card">


            <div class="auth-aside">

                <span class="auth-accent"></span>

                <h1 class="auth-title">
                    Criar Conta no SGIE
                </h1>

                <p class="auth-subtitle">
                    Cadastre-se para se inscrever em eventos,
                    emitir certificados e gerenciar suas
                    atividades acadêmicas com segurança.
                </p>

            </div>


            <form
                class="auth-form"
                id="form-cadastro"
                novalidate
            >

                <div
                    id="mensagem-alerta"
                    style="display: none;"
                ></div>


                <div class="form-grid">


                    <div class="form-group col-span-2">

                        <label
                            for="id_nome_completo"
                            class="form-label"
                        >
                            <span>
                                Nome Completo
                                <span class="req">*</span>
                            </span>
                        </label>

                        <div class="input-wrap">

                            <span
                                class="icon icon-user"
                                aria-hidden="true"
                            ></span>

                            <input
                                type="text"
                                id="id_nome_completo"
                                name="nome_completo"
                                class="input-field"
                                required
                                maxlength="150"
                                placeholder="Ex: Camila Santos de Almeida"
                                autocomplete="name"
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label
                            for="id_cpf"
                            class="form-label"
                        >
                            <span>
                                CPF
                                <span class="req">*</span>
                            </span>
                        </label>

                        <div class="input-wrap">

                            <span
                                class="icon icon-fingerprint"
                                aria-hidden="true"
                            ></span>

                            <input
                                type="text"
                                id="id_cpf"
                                name="cpf"
                                class="input-field"
                                required
                                inputmode="numeric"
                                maxlength="14"
                                placeholder="000.000.000-00"
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label
                            for="id_email"
                            class="form-label"
                        >
                            <span>
                                E-mail
                                <span class="req">*</span>
                            </span>
                        </label>

                        <div class="input-wrap">

                            <span
                                class="icon icon-mail"
                                aria-hidden="true"
                            ></span>

                            <input
                                type="email"
                                id="id_email"
                                name="email"
                                class="input-field"
                                required
                                placeholder="usuario@universidade.br"
                                autocomplete="email"
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label
                            for="id_telefone"
                            class="form-label"
                        >
                            <span>
                                Telefone / WhatsApp
                                <span class="req">*</span>
                            </span>
                        </label>

                        <div class="input-wrap">

                            <span
                                class="icon icon-phone"
                                aria-hidden="true"
                            ></span>

                            <input
                                type="tel"
                                id="id_telefone"
                                name="telefone"
                                class="input-field"
                                required
                                maxlength="15"
                                placeholder="(00) 00000-0000"
                                autocomplete="tel"
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label
                            for="id_data_nascimento"
                            class="form-label"
                        >
                            <span>
                                Data de Nascimento
                                <span class="req">*</span>
                            </span>
                        </label>

                        <div class="input-wrap">

                            <span
                                class="icon icon-calendar"
                                aria-hidden="true"
                            ></span>

                            <input
                                type="text"
                                id="id_data_nascimento"
                                name="data_nascimento"
                                class="input-field"
                                required
                                inputmode="numeric"
                                maxlength="10"
                                placeholder="dd/mm/aaaa"
                                autocomplete="bday"
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label
                            for="id_password"
                            class="form-label"
                        >
                            <span>
                                Senha
                                <span class="req">*</span>
                            </span>
                        </label>

                        <div class="input-wrap has-toggle">

                            <span
                                class="icon icon-lock"
                                aria-hidden="true"
                            ></span>

                            <input
                                type="password"
                                id="id_password"
                                name="password"
                                class="input-field"
                                required
                                minlength="8"
                                placeholder="Mínimo 8 caracteres"
                                autocomplete="new-password"
                            >

                            <button
                                type="button"
                                class="input-toggle"
                                data-toggle-senha
                                aria-label="Mostrar senha"
                            >
                                <span
                                    class="icon icon-eye"
                                    aria-hidden="true"
                                ></span>
                            </button>

                        </div>

                    </div>


                    <div class="form-group">

                        <label
                            for="id_password_confirm"
                            class="form-label"
                        >
                            <span>
                                Confirmar Senha
                                <span class="req">*</span>
                            </span>
                        </label>

                        <div class="input-wrap has-toggle">

                            <span
                                class="icon icon-lock"
                                aria-hidden="true"
                            ></span>

                            <input
                                type="password"
                                id="id_password_confirm"
                                name="password_confirm"
                                class="input-field"
                                required
                                minlength="8"
                                placeholder="Repita a senha"
                                autocomplete="new-password"
                            >

                            <button
                                type="button"
                                class="input-toggle"
                                data-toggle-senha
                                aria-label="Mostrar senha"
                            >
                                <span
                                    class="icon icon-eye"
                                    aria-hidden="true"
                                ></span>
                            </button>

                        </div>

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        id="btn-cadastrar"
                        class="btn btn-primary btn-block"
                    >
                        Cadastrar
                    </button>

                    <div class="divider">
                        OU
                    </div>

                    <a
                        href="../login/login.html"
                        class="btn btn-secondary btn-block"
                    >
                        Fazer Login
                    </a>

                </div>

            </form>

        </section>

    </main>


    <footer class="footer">

        <div class="container" style="padding-top: 0; padding-bottom: 0;">

            <p>
                SGIE — Sistema de Gestão de Inscrições
                e Eventos Universitários
            </p>

        </div>

    </footer>


    <script src="../../config.js"></script>
    <script src="../../api.js"></script>

    <script src="cadastro.js"></script>

</body>

</html>
