<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar - SGIE</title>

    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../auth.css">
    <link rel="stylesheet" href="login.css">
</head>

<body class="login-page">

    <nav class="navbar">
        <div class="navbar-container">

            <a href="../../index.html" class="brand">
                SGIE
                <span class="brand-badge">
                    Eventos
                </span>
            </a>

        </div>
    </nav>


    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-aside">

                <span class="auth-accent"></span>

                <h1 class="auth-title">
                    Acessar o SGIE
                </h1>

                <p class="auth-subtitle">
                    Entre com suas credenciais para
                    visualizar eventos e gerenciar inscrições.
                </p>

            </div>


            <form
                class="auth-form"
                id="form-login"
                novalidate
            >

                <div
                    id="mensagem-alerta"
                    style="display: none;"
                ></div>


                <div class="form-group">

                    <label
                        for="id_identificador"
                        class="form-label"
                    >
                        <span>
                            Identificador (E-mail ou CPF)
                            <span class="req">*</span>
                        </span>
                    </label>

                    <div class="input-wrap">

                        <span
                            class="icon icon-id-card"
                            aria-hidden="true"
                        ></span>

                        <input
                            type="text"
                            id="id_identificador"
                            name="identificador"
                            class="input-field"
                            required
                            placeholder="ex: usuario@universidade.br ou 000.000.000-00"
                            autocomplete="username"
                            autofocus
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label
                        for="id_password"
                        class="form-label"
                    >
                        <span>
                            Senha
                            <span class="req">*</span>
                        </span>
                    </label>

                    <div class="input-wrap has-toggle">

                        <span
                            class="icon icon-lock"
                            aria-hidden="true"
                        ></span>

                        <input
                            type="password"
                            id="id_password"
                            name="password"
                            class="input-field"
                            required
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            class="input-toggle"
                            data-toggle-senha
                            aria-label="Mostrar senha"
                        >
                            <span
                                class="icon icon-eye"
                                aria-hidden="true"
                            ></span>
                        </button>

                    </div>

                </div>


                <div class="form-link-row">
                    <a
                        href="../recuperar-senha/recuperar_senha.html"
                    >
                        Esqueceu sua senha?
                    </a>
                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        id="btn-entrar"
                        class="btn btn-primary btn-block"
                    >
                        Entrar
                    </button>

                    <div class="divider">
                        OU
                    </div>

                    <a
                        href="../cadastro/cadastro.html"
                        class="btn btn-secondary btn-block"
                    >
                        Cadastre-se
                    </a>

                </div>

            </form>

        </section>

    </main>


    <footer class="footer">
        <div class="container" style="padding-top: 0; padding-bottom: 0;">
            <p>
                SGIE — Sistema de Gestão de Inscrições
                e Eventos Universitários
            </p>
        </div>
    </footer>


    <script src="../../config.js"></script>
    <script src="../../api.js"></script>

    <script src="login.js"></script>

</body>

</html>
