<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Submissão - SGIE</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        @media (min-width: 900px) {
            .detail-grid {
                grid-template-columns: 2fr 1fr;
            }
        }
        .detail-card {
            background: #fff;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius-sm, 8px);
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .detail-card h2 {
            font-size: 1.1rem;
            margin: 0 0 0.75rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color, #e2e8f0);
            color: var(--text-color, #1e293b);
        }
        .detail-row {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 0.5rem 1rem;
            padding: 0.4rem 0;
            font-size: 0.9rem;
            border-bottom: 1px dashed #f1f5f9;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-row dt {
            color: var(--text-muted, #64748b);
            font-weight: 500;
            margin: 0;
        }
        .detail-row dd {
            margin: 0;
            color: var(--text-color, #1e293b);
            word-break: break-word;
        }
        .detail-texto {
            white-space: pre-wrap;
            line-height: 1.5;
            color: var(--text-color, #1e293b);
            font-size: 0.9rem;
        }
        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .badge-rascunho { background: #e2e8f0; color: #475569; }
        .badge-submetida { background: #dbeafe; color: #1d4ed8; }
        .badge-avaliacao { background: #fef3c7; color: #b45309; }
        .badge-correcoes { background: #ffedd5; color: #c2410c; }
        .badge-aprovada { background: #dcfce7; color: #15803d; }
        .badge-rejeitada { background: #fee2e2; color: #b91c1c; }
        .autor-card {
            background: #f8fafc;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius-sm, 8px);
            padding: 0.9rem;
            margin-bottom: 0.6rem;
        }
        .autor-card .autor-nome {
            font-weight: 600;
            color: var(--text-color, #1e293b);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .autor-card .autor-meta {
            font-size: 0.82rem;
            color: var(--text-muted, #64748b);
            margin-top: 0.25rem;
            line-height: 1.5;
        }
        .tag-principal {
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .versao-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius-sm, 8px);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .versao-item .versao-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .versao-item .versao-info small {
            color: var(--text-muted, #64748b);
        }
        .avaliacao-item {
            background: #fffbeb;
            border-left: 3px solid #f59e0b;
            border-radius: var(--radius-sm, 8px);
            padding: 0.9rem;
            margin-bottom: 0.75rem;
        }
        .avaliacao-item.aprovado { background: #f0fdf4; border-left-color: #16a34a; }
        .avaliacao-item.rejeitado { background: #fef2f2; border-left-color: #dc2626; }
        .avaliacao-item .avaliacao-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .avaliacao-item .avaliacao-header strong {
            color: var(--text-color, #1e293b);
        }
        .avaliacao-item .avaliacao-meta {
            font-size: 0.78rem;
            color: var(--text-muted, #64748b);
        }
        .avaliacao-item .avaliacao-obs {
            font-size: 0.88rem;
            color: var(--text-color, #1e293b);
            white-space: pre-wrap;
            margin-top: 0.4rem;
        }
        .timeline {
            list-style: none;
            padding: 0;
            margin: 0;
            position: relative;
        }
        .timeline li {
            position: relative;
            padding: 0.5rem 0 0.5rem 1.5rem;
            border-left: 2px solid var(--border-color, #e2e8f0);
            font-size: 0.85rem;
        }
        .timeline li::before {
            content: '';
            position: absolute;
            left: -7px;
            top: 0.9rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-color, #2563eb);
            border: 2px solid #fff;
        }
        .timeline li.tl-rascunho::before { background: #64748b; }
        .timeline li.tl-submetida::before { background: #2563eb; }
        .timeline li.tl-avaliacao::before { background: #f59e0b; }
        .timeline li.tl-correcoes::before { background: #f97316; }
        .timeline li.tl-aprovada::before { background: #16a34a; }
        .timeline li.tl-rejeitada::before { background: #dc2626; }
        .timeline li small {
            display: block;
            color: var(--text-muted, #64748b);
            margin-top: 0.15rem;
        }
        .loading-box {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted, #64748b);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }
        .modal-box {
            background: #fff;
            border-radius: var(--radius-sm, 8px);
            padding: 1.5rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .modal-box h3 { margin: 0 0 0.5rem 0; }
        .modal-box p { margin: 0 0 1rem 0; color: var(--text-muted, #64748b); font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="brand">
                SGIE
                <span class="brand-badge">Submissão</span>
            </a>
            <ul class="nav-links"></ul>
            <div class="nav-user" id="nav-user-area"></div>
        </div>
    </nav>

    <div class="container">
        <header class="page-header">
            <div>
                <h1 class="page-title" id="page-titulo">Detalhes da Submissão</h1>
                <p class="page-subtitle" id="page-subtitulo">Carregando...</p>
            </div>
            <div class="btn-group" id="acoes-topo">
                <a href="minhas-submissoes.html" class="btn btn-secondary">← Minhas Submissões</a>
            </div>
        </header>

        <div id="mensagem-alerta" style="display: none;"></div>

        <div id="conteudo">
            <div class="loading-box">Carregando submissão...</div>
        </div>
    </div>

    <footer class="footer">
        <div class="container" style="padding-top: 0; padding-bottom: 0;">
            <p>SGIE — Sistema de Gestão de Inscrições e Eventos Universitários</p>
        </div>
    </footer>

    <script src="../config.js"></script>
    <script src="../api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {

            // ============================================================
            // 1. AUTENTICAÇÃO
            // ============================================================

            if (!isAuthenticated()) {
                window.location.href = '../usuarios/login.html';
                return;
            }
            atualizarCabecalhoUsuario();

            const usuarioLogado = getUser();
            if (!usuarioLogado) {
                window.location.href = '../usuarios/login.html';
                return;
            }


            // ============================================================
            // 2. PARÂMETROS
            // ============================================================

            const params = new URLSearchParams(window.location.search);
            const submissaoId = params.get('id');

            const conteudo = document.getElementById('conteudo');
            const pageTitulo = document.getElementById('page-titulo');
            const pageSubtitulo = document.getElementById('page-subtitulo');
            const acoesTopo = document.getElementById('acoes-topo');

            if (!submissaoId) {
                pageSubtitulo.textContent = 'Submissão não identificada.';
                conteudo.innerHTML = `
                    <div class="empty-state" style="text-align:center;padding:3rem;">
                        <h3>Submissão não encontrada</h3>
                        <p>Nenhum ID foi informado na URL.</p>
                        <a href="minhas-submissoes.html" class="btn btn-primary">Voltar para Minhas Submissões</a>
                    </div>
                `;
                return;
            }


            // ============================================================
            // 3. UTILITÁRIOS
            // ============================================================

            function escaparHtml(valor) {
                if (valor === null || valor === undefined) return '';
                return String(valor)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            function formatarDataHoraSegura(iso) {
                if (!iso) return '—';
                try {
                    if (typeof formatarDataHora === 'function') return formatarDataHora(iso);
                    const d = new Date(iso);
                    if (Number.isNaN(d.getTime())) return '—';
                    return d.toLocaleString('pt-BR');
                } catch { return '—'; }
            }

            function formatarDataSegura(iso) {
                if (!iso) return '—';
                try {
                    const d = new Date(iso);
                    if (Number.isNaN(d.getTime())) return '—';
                    return d.toLocaleDateString('pt-BR');
                } catch { return '—'; }
            }

            function formatarErroApi(erro) {
                if (!erro) return 'Ocorreu um erro desconhecido.';
                if (typeof erro === 'string') return escaparHtml(erro);
                if (erro.detail) return escaparHtml(erro.detail);
                if (erro.message) return escaparHtml(erro.message);
                if (typeof erro === 'object') {
                    return Object.entries(erro).map(([campo, msgs]) => {
                        const texto = Array.isArray(msgs) ? msgs.join(', ') : String(msgs);
                        return `${escaparHtml(campo)}: ${escaparHtml(texto)}`;
                    }).join('<br>');
                }
                return 'Não foi possível concluir a operação.';
            }

            async function lerResposta(response) {
                const texto = await response.text();
                if (!texto) return null;
                try { return JSON.parse(texto); } catch { return texto; }
            }

            function badgeClasse(status) {
                switch (status) {
                    case 'Rascunho': return 'badge-rascunho';
                    case 'Submetida': return 'badge-submetida';
                    case 'Em avaliação': return 'badge-avaliacao';
                    case 'Correções solicitadas': return 'badge-correcoes';
                    case 'Aprovada': return 'badge-aprovada';
                    case 'Rejeitada': return 'badge-rejeitada';
                    default: return 'badge-rascunho';
                }
            }

            function timelineClasse(status) {
                switch (status) {
                    case 'Rascunho': return 'tl-rascunho';
                    case 'Submetida': return 'tl-submetida';
                    case 'Em avaliação': return 'tl-avaliacao';
                    case 'Correções solicitadas': return 'tl-correcoes';
                    case 'Aprovada': return 'tl-aprovada';
                    case 'Rejeitada': return 'tl-rejeitada';
                    default: return 'tl-rascunho';
                }
            }

            function nomeArquivo(url) {
                if (!url) return '—';
                try {
                    return decodeURIComponent(url.split('?')[0].split('/').pop());
                } catch { return url; }
            }


            // ============================================================
            // 4. ESTADO
            // ============================================================

            let submissao = null;


            // ============================================================
            // 5. CARREGAR
            // ============================================================

            async function carregarSubmissao() {
                conteudo.innerHTML = '<div class="loading-box">Carregando submissão...</div>';

                try {
                    const response = await apiFetch(`/submissoes/${encodeURIComponent(submissaoId)}/`);

                    if (!response.ok) {
                        const erro = await lerResposta(response);
                        if (response.status === 404) {
                            conteudo.innerHTML = `
                                <div style="text-align:center;padding:3rem;">
                                    <h3>Submissão não encontrada</h3>
                                    <p style="color:#64748b;">Ela pode ter sido removida ou você não tem acesso.</p>
                                    <a href="minhas-submissoes.html" class="btn btn-primary">Voltar</a>
                                </div>
                            `;
                            return;
                        }
                        if (response.status === 403) {
                            conteudo.innerHTML = `
                                <div style="text-align:center;padding:3rem;">
                                    <h3>Acesso negado</h3>
                                    <p style="color:#64748b;">Você não tem permissão para ver esta submissão.</p>
                                    <a href="minhas-submissoes.html" class="btn btn-primary">Voltar</a>
                                </div>
                            `;
                            return;
                        }
                        conteudo.innerHTML = '';
                        showAlert('mensagem-alerta', formatarErroApi(erro), 'danger');
                        return;
                    }

                    submissao = await lerResposta(response);
                    console.log('Submissão:', submissao);
                    renderizar();

                } catch (erro) {
                    console.error(erro);
                    conteudo.innerHTML = '';
                    showAlert('mensagem-alerta', 'Erro de comunicação ao carregar a submissão.', 'danger');
                }
            }


            // ============================================================
            // 6. RENDERIZAR
            // ============================================================

            function renderizar() {
                if (!submissao) return;

                pageTitulo.textContent = submissao.titulo || 'Submissão';
                pageSubtitulo.textContent = `Evento: ${submissao.evento_nome || '—'} • Área: ${submissao.area_nome || '—'}`;

                renderizarAcoesTopo();
                renderizarConteudo();
            }


            function renderizarAcoesTopo() {
                const acoes = [];

                acoes.push(`<a href="minhas-submissoes.html" class="btn btn-secondary">← Minhas Submissões</a>`);

                if (submissao.pode_editar) {
                    acoes.push(`<a href="submissao.html?id=${encodeURIComponent(submissao.id)}" class="btn btn-secondary">Editar</a>`);
                }

                if (submissao.pode_submeter) {
                    acoes.push(`<button type="button" id="btn-submeter-topo" class="btn btn-primary">Submeter</button>`);
                }

                if (submissao.status === 'Rascunho') {
                    acoes.push(`<button type="button" id="btn-excluir-topo" class="btn btn-danger">Excluir</button>`);
                }

                acoesTopo.innerHTML = acoes.join('');

                const btnSub = document.getElementById('btn-submeter-topo');
                if (btnSub) btnSub.addEventListener('click', abrirModalSubmeter);

                const btnExc = document.getElementById('btn-excluir-topo');
                if (btnExc) btnExc.addEventListener('click', excluirSubmissao);
            }


            function renderizarConteudo() {
                const autores = submissao.autores || [];
                const versoes = submissao.versoes || [];
                const avaliacoes = submissao.avaliacoes || [];
                const apresentacoes = submissao.apresentacoes || [];

                const autoresOrdenados = [...autores].sort((a, b) => {
                    if (a.tipo_participacao === 'Principal') return -1;
                    if (b.tipo_participacao === 'Principal') return 1;
                    return (a.ordem_autoria || 0) - (b.ordem_autoria || 0);
                });

                conteudo.innerHTML = `
                    <div class="detail-grid">
                        <!-- COLUNA ESQUERDA -->
                        <div>
                            <!-- DADOS DO TRABALHO -->
                            <div class="detail-card">
                                <h2>Dados do Trabalho</h2>
                                <dl style="margin:0;">
                                    <div class="detail-row">
                                        <dt>Título</dt>
                                        <dd>${escaparHtml(submissao.titulo || '—')}</dd>
                                    </div>
                                    <div class="detail-row">
                                        <dt>Tipo</dt>
                                        <dd>${escaparHtml(submissao.tipo_display || submissao.tipo || '—')}</dd>
                                    </div>
                                    <div class="detail-row">
                                        <dt>Área Temática</dt>
                                        <dd>${escaparHtml(submissao.area_nome || '—')}</dd>
                                    </div>
                                    <div class="detail-row">
                                        <dt>Palavras-chave</dt>
                                        <dd>${escaparHtml(submissao.palavras_chave || '—')}</dd>
                                    </div>
                                    <div class="detail-row">
                                        <dt>Criado em</dt>
                                        <dd>${escaparHtml(formatarDataHoraSegura(submissao.criado_em))}</dd>
                                    </div>
                                    <div class="detail-row">
                                        <dt>Última atualização</dt>
                                        <dd>${escaparHtml(formatarDataHoraSegura(submissao.atualizado_em))}</dd>
                                    </div>
                                </dl>
                            </div>

                            <!-- RESUMO -->
                            <div class="detail-card">
                                <h2>Resumo</h2>
                                <div class="detail-texto">${escaparHtml(submissao.resumo || '—')}</div>
                            </div>

                            <!-- ABSTRACT -->
                            <div class="detail-card">
                                <h2>Abstract</h2>
                                <div class="detail-texto">${escaparHtml(submissao.abstract || '—')}</div>
                            </div>

                            ${submissao.descricao ? `
                                <div class="detail-card">
                                    <h2>Descrição Adicional</h2>
                                    <div class="detail-texto">${escaparHtml(submissao.descricao)}</div>
                                </div>
                            ` : ''}

                            <!-- AUTORES -->
                            <div class="detail-card">
                                <h2>Autores (${autoresOrdenados.length})</h2>
                                ${autoresOrdenados.length === 0
                                    ? '<p style="color:#64748b;font-size:0.9rem;">Nenhum autor registrado.</p>'
                                    : autoresOrdenados.map(a => renderAutor(a)).join('')
                                }
                            </div>

                            <!-- AVALIAÇÕES -->
                            <div class="detail-card">
                                <h2>Avaliações (${avaliacoes.length})</h2>
                                ${avaliacoes.length === 0
                                    ? '<p style="color:#64748b;font-size:0.9rem;">Nenhuma avaliação registrada ainda.</p>'
                                    : avaliacoes.map(renderAvaliacao).join('')
                                }
                            </div>
                        </div>

                        <!-- COLUNA DIREITA -->
                        <div>
                            <!-- STATUS -->
                            <div class="detail-card">
                                <h2>Status</h2>
                                <div style="text-align:center;padding:0.5rem 0;">
                                    <span class="badge ${badgeClasse(submissao.status)}" style="font-size:0.85rem;padding:0.5rem 1rem;">
                                        ${escaparHtml(submissao.status_display || submissao.status)}
                                    </span>
                                </div>
                            </div>

                            <!-- VERSÕES -->
                            <div class="detail-card">
                                <h2>Versões (${versoes.length})</h2>
                                ${versoes.length === 0
                                    ? '<p style="color:#64748b;font-size:0.9rem;">Nenhum arquivo enviado ainda.</p>'
                                    : versoes
                                        .sort((a, b) => (a.numero_versao || 0) - (b.numero_versao || 0))
                                        .map(v => `
                                            <div class="versao-item">
                                                <div class="versao-info">
                                                    <strong>Versão ${escaparHtml(v.numero_versao)}</strong>
                                                    <small>${escaparHtml(formatarDataHoraSegura(v.criado_em))}</small>
                                                    <small>${escaparHtml(nomeArquivo(v.caminho_arquivo))}</small>
                                                </div>
                                                ${v.caminho_arquivo
                                                    ? `<a href="${escaparHtml(v.caminho_arquivo)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">Baixar</a>`
                                                    : ''
                                                }
                                            </div>
                                        `).join('')
                                }
                            </div>

                            <!-- TIMELINE -->
                            <div class="detail-card">
                                <h2>Histórico</h2>
                                <ul class="timeline">
                                    <li class="tl-rascunho">
                                        <strong>Criada como rascunho</strong>
                                        <small>${escaparHtml(formatarDataHoraSegura(submissao.criado_em))}</small>
                                    </li>
                                    ${versoes.map(v => `
                                        <li class="tl-submetida">
                                            <strong>Versão ${escaparHtml(v.numero_versao)} enviada</strong>
                                            <small>${escaparHtml(formatarDataHoraSegura(v.criado_em))}</small>
                                        </li>
                                    `).join('')}
                                    ${avaliacoes.map(a => `
                                        <li class="${timelineClasse(a.status_parecer === 'Aprovado' ? 'Aprovada' : a.status_parecer === 'Rejeitado' ? 'Rejeitada' : 'Correções solicitadas')}">
                                            <strong>Parecer: ${escaparHtml(a.status_parecer_display || a.status_parecer)}</strong>
                                            <small>${escaparHtml(formatarDataHoraSegura(a.criado_em))}</small>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>

                            ${apresentacoes.length > 0 ? `
                                <div class="detail-card">
                                    <h2>Apresentação</h2>
                                    ${apresentacoes.map(ap => `
                                        <dl style="margin:0;">
                                            <div class="detail-row">
                                                <dt>Local</dt>
                                                <dd>${escaparHtml(ap.local_nome || '—')}</dd>
                                            </div>
                                            <div class="detail-row">
                                                <dt>Início</dt>
                                                <dd>${escaparHtml(formatarDataHoraSegura(ap.inicio))}</dd>
                                            </div>
                                            <div class="detail-row">
                                                <dt>Fim</dt>
                                                <dd>${escaparHtml(formatarDataHoraSegura(ap.fim))}</dd>
                                            </div>
                                            <div class="detail-row">
                                                <dt>Duração</dt>
                                                <dd>${escaparHtml(ap.duracao_minutos)} min</dd>
                                            </div>
                                        </dl>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }


            function renderAutor(a) {
                const principal = a.tipo_participacao === 'Principal';
                const nome = a.usuario_nome || a.nome_completo || 'Autor';
                const email = a.usuario_email || a.email || '';
                const titulo = a.maior_titulacao || a.maiór_titulacao || '';

                const links = [];
                if (a.lattes_url) {
                    links.push(`<a href="${escaparHtml(a.lattes_url)}" target="_blank" rel="noopener">Lattes</a>`);
                }
                if (a.linkedin_url) {
                    links.push(`<a href="${escaparHtml(a.linkedin_url)}" target="_blank" rel="noopener">LinkedIn</a>`);
                }

                return `
                    <div class="autor-card">
                        <div class="autor-nome">
                            ${escaparHtml(nome)}
                            ${principal ? '<span class="tag-principal">Principal</span>' : ''}
                        </div>
                        <div class="autor-meta">
                            ${email ? `E-mail: ${escaparHtml(email)}<br>` : ''}
                            ${a.afiliacao_institucional ? `Afiliação: ${escaparHtml(a.afiliacao_institucional)}<br>` : ''}
                            ${titulo ? `Titulação: ${escaparHtml(titulo)}<br>` : ''}
                            ${links.length > 0 ? links.join(' • ') : ''}
                        </div>
                    </div>
                `;
            }


            function renderAvaliacao(a) {
                const classe = a.status_parecer === 'Aprovado'
                    ? 'aprovado'
                    : a.status_parecer === 'Rejeitado'
                        ? 'rejeitado'
                        : '';

                const pontuacao = (a.pontuacao !== null && a.pontuacao !== undefined)
                    ? `Pontuação: ${escaparHtml(a.pontuacao)}`
                    : '';

                return `
                    <div class="avaliacao-item ${classe}">
                        <div class="avaliacao-header">
                            <strong>${escaparHtml(a.status_parecer_display || a.status_parecer)}</strong>
                            <span class="avaliacao-meta">${escaparHtml(formatarDataHoraSegura(a.criado_em))}</span>
                        </div>
                        <div class="avaliacao-meta">
                            Avaliador: ${escaparHtml(a.avaliador_nome || 'Anônimo')}
                            ${pontuacao ? ' • ' + pontuacao : ''}
                        </div>
                        <div class="avaliacao-obs">${escaparHtml(a.observacoes || '')}</div>
                    </div>
                `;
            }


            // ============================================================
            // 7. SUBMETER (modal)
            // ============================================================

            function abrirModalSubmeter() {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="modal-box">
                        <h3>Submeter trabalho</h3>
                        <p>Envie o arquivo PDF ou DOCX. Isso criará uma nova versão e mudará o status para <strong>Submetida</strong>.</p>
                        <form id="form-submeter">
                            <div class="form-group">
                                <label class="form-label">Arquivo <span class="req">*</span></label>
                                <input type="file" id="modal-arquivo" class="input-field" accept=".pdf,.docx" required>
                            </div>
                            <div class="btn-group" style="justify-content:flex-end; margin-top:1rem;">
                                <button type="button" class="btn btn-secondary" id="modal-cancelar">Cancelar</button>
                                <button type="submit" class="btn btn-primary" id="modal-enviar">Enviar</button>
                            </div>
                        </form>
                    </div>
                `;
                document.body.appendChild(overlay);

                const fechar = () => overlay.remove();
                overlay.querySelector('#modal-cancelar').addEventListener('click', fechar);
                overlay.addEventListener('click', (e) => { if (e.target === overlay) fechar(); });

                overlay.querySelector('#form-submeter').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const input = overlay.querySelector('#modal-arquivo');
                    const btn = overlay.querySelector('#modal-enviar');

                    if (!input.files || input.files.length === 0) {
                        showAlert('mensagem-alerta', 'Selecione um arquivo.', 'danger');
                        return;
                    }

                    const arquivo = input.files[0];
                    const nome = arquivo.name.toLowerCase();
                    if (!nome.endsWith('.pdf') && !nome.endsWith('.docx')) {
                        showAlert('mensagem-alerta', 'O arquivo deve ser PDF ou DOCX.', 'danger');
                        return;
                    }
                    if (arquivo.size > 20 * 1024 * 1024) {
                        showAlert('mensagem-alerta', 'O arquivo deve ter no máximo 20 MB.', 'danger');
                        return;
                    }

                    btn.disabled = true;
                    btn.textContent = 'Enviando...';

                    try {
                        const fd = new FormData();
                        fd.append('arquivo', arquivo);

                        const response = await apiFetch(
                            `/submissoes/${encodeURIComponent(submissao.id)}/submeter/`,
                            { method: 'POST', body: fd }
                        );

                        const resultado = await lerResposta(response);

                        if (!response.ok) {
                            showAlert('mensagem-alerta', formatarErroApi(resultado), 'danger');
                            btn.disabled = false;
                            btn.textContent = 'Enviar';
                            return;
                        }

                        fechar();
                        showAlert('mensagem-alerta', 'Submissão enviada com sucesso!', 'success');
                        await carregarSubmissao();

                    } catch (erro) {
                        console.error(erro);
                        showAlert('mensagem-alerta', 'Erro de comunicação ao enviar o arquivo.', 'danger');
                        btn.disabled = false;
                        btn.textContent = 'Enviar';
                    }
                });
            }


            // ============================================================
            // 8. EXCLUIR
            // ============================================================

            async function excluirSubmissao() {
                const confirmado = window.confirm(
                    `Excluir a submissão "${submissao.titulo}"? Esta ação não pode ser desfeita.`
                );
                if (!confirmado) return;

                try {
                    const response = await apiFetch(
                        `/submissoes/${encodeURIComponent(submissao.id)}/`,
                        { method: 'DELETE' }
                    );

                    if (response.status !== 204 && !response.ok) {
                        const erro = await lerResposta(response);
                        showAlert('mensagem-alerta', formatarErroApi(erro), 'danger');
                        return;
                    }

                    showAlert('mensagem-alerta', 'Submissão excluída. Redirecionando...', 'success');
                    setTimeout(() => {
                        window.location.href = 'minhas-submissoes.html';
                    }, 700);

                } catch (erro) {
                    console.error(erro);
                    showAlert('mensagem-alerta', 'Erro de comunicação ao excluir.', 'danger');
                }
            }


            // ============================================================
            // 9. START
            // ============================================================

            await carregarSubmissao();

        });
    </script>
</body>
</html>
