<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil de Avaliador - SGIE</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .perfil-hero {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            color: #fff;
            border-radius: var(--radius-sm, 8px);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        .perfil-hero h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.6rem;
        }
        .perfil-hero p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.95rem;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(255,255,255,0.2);
            color: #fff;
            margin-top: 0.75rem;
        }
        .status-pill.ativo::before {
            content: '●';
            color: #4ade80;
            font-size: 1.1rem;
            line-height: 1;
        }
        .status-pill.inativo::before {
            content: '●';
            color: #f87171;
            font-size: 1.1rem;
            line-height: 1;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem;
        }
        .info-card {
            background: #fff;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius-sm, 8px);
            padding: 1.25rem;
        }
        .info-card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted, #64748b);
            letter-spacing: 0.03em;
            margin: 0 0 0.5rem 0;
        }
        .info-card .valor {
            font-size: 1.05rem;
            color: var(--text-color, #1e293b);
            font-weight: 500;
            word-break: break-word;
        }
        .areas-lista {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .area-tag {
            background: #e0e7ff;
            color: #3730a3;
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            background: #f8fafc;
            border-radius: var(--radius-sm, 8px);
            border: 1px dashed var(--border-color, #e2e8f0);
        }
        .empty-state h3 {
            margin: 0 0 0.5rem 0;
            color: var(--text-color, #1e293b);
        }
        .empty-state p {
            margin: 0 0 1rem 0;
            color: var(--text-muted, #64748b);
        }
        .loading-box {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted, #64748b);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="brand">
                SGIE
                <span class="brand-badge">Avaliador</span>
            </a>
            <ul class="nav-links"></ul>
            <div class="nav-user" id="nav-user-area"></div>
        </div>
    </nav>

    <div class="container">
        <div style="margin-bottom: 1rem;">
            <a href="../index.html" class="btn btn-sm btn-secondary">← Voltar</a>
        </div>

        <div id="mensagem-alerta" style="display: none;"></div>

        <div id="conteudo">
            <div class="loading-box">Carregando seu perfil de avaliador...</div>
        </div>
    </div>

    <footer class="footer">
        <div class="container" style="padding-top: 0; padding-bottom: 0;">
            <p>SGIE — Sistema de Gestão de Inscrições e Eventos Universitários</p>
        </div>
    </footer>

    <script src="../config.js"></script>
    <script src="../api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {

            // ============================================================
            // 1. AUTENTICAÇÃO
            // ============================================================

            if (!isAuthenticated()) {
                window.location.href = '../usuarios/login.html';
                return;
            }
            atualizarCabecalhoUsuario();

            const usuarioLogado = getUser();
            if (!usuarioLogado) {
                window.location.href = '../usuarios/login.html';
                return;
            }

            const conteudo = document.getElementById('conteudo');


            // ============================================================
            // 2. UTILITÁRIOS
            // ============================================================

            function escaparHtml(valor) {
                if (valor === null || valor === undefined) return '';
                return String(valor)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            async function lerResposta(response) {
                const texto = await response.text();
                if (!texto) return null;
                try { return JSON.parse(texto); } catch { return texto; }
            }


            // ============================================================
            // 3. CARREGAR PERFIL
            // ============================================================

            async function carregarPerfil() {
                conteudo.innerHTML = '<div class="loading-box">Carregando seu perfil de avaliador...</div>';

                try {
                    const response = await apiFetch('/avaliadores/');
                    if (!response.ok) {
                        conteudo.innerHTML = '';
                        showAlert('mensagem-alerta', 'Não foi possível carregar seu perfil.', 'danger');
                        return;
                    }

                    const data = await lerResposta(response);
                    const lista = Array.isArray(data) ? data : (data?.results || []);
                    const perfil = lista.find(a => String(a.usuario) === String(usuarioLogado.id));

                    if (!perfil) {
                        renderizarSemPerfil();
                        return;
                    }

                    renderizarPerfil(perfil);

                } catch (e) {
                    console.error(e);
                    conteudo.innerHTML = '';
                    showAlert('mensagem-alerta', 'Erro de comunicação ao carregar o perfil.', 'danger');
                }
            }


            // ============================================================
            // 4. RENDERIZAR — SEM PERFIL
            // ============================================================

            function renderizarSemPerfil() {
                conteudo.innerHTML = `
                    <div class="empty-state">
                        <h3>Você ainda não é um avaliador</h3>
                        <p>
                            Cadastre-se para ser sorteado como revisor de submissões
                            nas áreas em que você tem competência.
                        </p>
                        <a href="cadastro-avaliador.html" class="btn btn-primary">
                            Quero me cadastrar como Avaliador
                        </a>
                    </div>
                `;
            }


            // ============================================================
            // 5. RENDERIZAR — COM PERFIL
            // ============================================================

            function renderizarPerfil(p) {
                const nome = p.usuario_nome || usuarioLogado.nome_completo || 'Avaliador';
                const ativo = p.ativo !== false;
                const areas = p.areas_nomes || [];

                conteudo.innerHTML = `
                    <div class="perfil-hero">
                        <h1>Olá, ${escaparHtml(nome)}</h1>
                        <p>Este é o seu perfil de avaliador no SGIE.</p>
                        <span class="status-pill ${ativo ? 'ativo' : 'inativo'}">
                            ${ativo ? 'Disponível para avaliação' : 'Pausado — não recebe novas atribuições'}
                        </span>
                    </div>

                    <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.5rem;">
                        <a href="cadastro-avaliador.html" class="btn btn-primary">✏ Editar Perfil</a>
                    </div>

                    <div class="info-grid">
                        <div class="info-card" style="grid-column: 1 / -1;">
                            <h3>Áreas de Atuação</h3>
                            <div class="areas-lista">
                                ${areas.length === 0
                                    ? '<span style="color:#64748b;">Nenhuma área cadastrada.</span>'
                                    : areas.map(a => `<span class="area-tag">${escaparHtml(a)}</span>`).join('')
                                }
                            </div>
                        </div>

                        <div class="info-card">
                            <h3>Maior Titulação</h3>
                            <div class="valor">
                                ${escaparHtml(p.maior_titulacao || 'Não informado')}
                            </div>
                        </div>

                        <div class="info-card">
                            <h3>Afiliação Institucional</h3>
                            <div class="valor">
                                ${escaparHtml(p.afiliacao_institucional || 'Não informado')}
                            </div>
                        </div>

                        <div class="info-card">
                            <h3>Currículo Lattes</h3>
                            <div class="valor">
                                ${p.lattes_url
                                    ? `<a href="${escaparHtml(p.lattes_url)}" target="_blank" rel="noopener">Abrir Lattes ↗</a>`
                                    : '<span style="color:#64748b;">Não informado</span>'
                                }
                            </div>
                        </div>

                        <div class="info-card">
                            <h3>LinkedIn</h3>
                            <div class="valor">
                                ${p.linkedin_url
                                    ? `<a href="${escaparHtml(p.linkedin_url)}" target="_blank" rel="noopener">Abrir LinkedIn ↗</a>`
                                    : '<span style="color:#64748b;">Não informado</span>'
                                }
                            </div>
                        </div>

                        <div class="info-card" style="grid-column: 1 / -1;">
                            <h3>Próximas Atribuições</h3>
                            <div class="valor" style="color:#64748b; font-weight:400;">
                                Em breve você poderá ver aqui as submissões atribuídas a você.
                                (A funcionalidade de sorteio está em desenvolvimento.)
                            </div>
                        </div>
                    </div>
                `;
            }


            // ============================================================
            // 6. START
            // ============================================================

            await carregarPerfil();

        });
    </script>
</body>
</html>
